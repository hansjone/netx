[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netx-mcp"
version = "0.3.0"
description = "stdio MCP server for netx REST API (NMS alarms, managed NE CLI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27.0",
]

[project.scripts]
netx-mcp = "netx_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
