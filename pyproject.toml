[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netx-ops"
version = "0.2.0"
description = "netx operations tool: alarm-centric workflows with REST API and stdio MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "websockets>=12.0",
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "pandas>=2.0.0",
  "openpyxl>=3.1.0",
  "PyYAML>=6.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "python-multipart>=0.0.9",
  "websocket-client>=1.8.0",
  "cryptography>=42.0.0",
  "netmiko>=4.3.0",
  "bcrypt>=4.1.0",
  "PyJWT>=2.8.0",
  "alembic>=1.13.0",
]

[project.optional-dependencies]
mcp = ["netx-mcp @ file:packages/netx-mcp"]

[project.scripts]
netx-mcp = "netx_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["netx_api*"]
